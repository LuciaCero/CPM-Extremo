name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  test:
    name: Tests and smoke run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz graphviz-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest -v

      - name: Smoke test — run the CLI on every input
        run: |
          for f in inputs/*.xlsx; do
            echo "::group::$f"
            cpm-extremo "$f"
            echo "::endgroup::"
          done

      - name: Check that every input produced its four output files
        run: |
          status=0
          for f in inputs/*.xlsx; do
            name=$(basename "$f" .xlsx)
            for artifact in output_graph.png output_gantt.png output_coste-tiempo.png output_pert.txt; do
              path="output/$name/$artifact"
              if [ ! -s "$path" ]; then
                echo "Missing or empty: $path"
                status=1
              fi
            done
          done
          exit $status

      - name: Upload the generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpm-outputs
          path: output/
