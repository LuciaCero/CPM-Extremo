[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpm-extremo"
version = "1.0.0"
description = "Implementación del método CPM extremo con análisis coste-tiempo, grafo AOA, diagrama de Gantt e informe LaTeX."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "LuciaCero" },
]
keywords = ["cpm", "pert", "camino-critico", "coste-tiempo", "aoa", "gantt", "planificacion"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Education",
    "Natural Language :: Spanish",
]
dependencies = [
    "pandas>=2.0",
    "networkx>=3.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "kaleido>=0.2",
    "pygraphviz>=1.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cpm-extremo = "cpm_extremo.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
